# Hot Tub Dashboard -- Lovelace YAML
#
# Paste each card separately into the Lovelace raw YAML editor:
# Edit Dashboard -> Add Card -> Manual (bottom of card picker list).

---
# Card 1: Temperature gauge
type: gauge
entity: sensor.tublemetry_hot_tub_temperature
name: Hot Tub
min: 32
max: 110
needle: true
segments:
  - from: 32
    color: blue
  - from: 99
    color: orange
  - from: 104
    color: red

---
# Card 2: Setpoint control + current temp
type: entities
title: Hot Tub
entities:
  - entity: sensor.tublemetry_hot_tub_temperature
    name: Water Temperature
  - entity: number.tublemetry_hot_tub_setpoint
    name: Setpoint

---
# Card 3: Thermodynamics -- temp vs setpoint vs outdoor air (72h)
type: history-graph
title: Hot Tub Thermodynamics
hours_to_show: 72
entities:
  - entity: sensor.tublemetry_hot_tub_temperature
    name: Water Temp
  - entity: number.tublemetry_hot_tub_setpoint
    name: Setpoint
  - entity: sensor.outdoor_temperature
    name: Outdoor Air

---
# Card 4: Short-term history (24h detail)
type: history-graph
title: Hot Tub (24h)
hours_to_show: 24
entities:
  - entity: sensor.tublemetry_hot_tub_temperature
    name: Water Temp
  - entity: number.tublemetry_hot_tub_setpoint
    name: Setpoint
  - entity: sensor.outdoor_temperature
    name: Outdoor Air

---
# Card 5: Diagnostics
type: entities
title: Hot Tub Diagnostics
entities:
  - entity: sensor.tublemetry_hot_tub_display_state
    name: Display State
  - entity: sensor.tublemetry_hot_tub_decode_confidence
    name: Decode Confidence
  - entity: sensor.tublemetry_hot_tub_last_update
    name: Last Update
  - entity: sensor.tublemetry_hot_tub_wifi_signal
    name: WiFi Signal

---
# Card 6: Status
type: entities
title: Hot Tub Status
entities:
  - entity: binary_sensor.tublemetry_hot_tub_heater
    name: Heater
  - entity: binary_sensor.tublemetry_hot_tub_pump
    name: Pump
  - entity: binary_sensor.tublemetry_hot_tub_light
    name: Light

---
# Card 7: Thermal model — preheat planning
# Requires ha/thermal_model.yaml to be configured in HA.
type: entities
title: Hot Tub Preheat
entities:
  - entity: sensor.hot_tub_preheat_eta
    name: Time to Setpoint
    icon: mdi:clock-outline
  - entity: sensor.hot_tub_preheat_minutes
    name: Preheat Minutes
  - entity: sensor.hot_tub_heating_rate
    name: Heating Rate
  - entity: sensor.hot_tub_cooling_rate
    name: Cooling Rate (°F/hr lost)
  - entity: sensor.outdoor_temperature
    name: Outdoor Temp

---
# Card 8: TOU schedule controls -- seasonal setpoints
# Drag Max down to ~101 for summer, back to 104 for winter. Coast is the
# on-peak / overnight floor. "Expected Now" is what the schedule is currently
# targeting; "Commanded" is what HA sent; "Panel" is what the tub display shows.
type: entities
title: Hot Tub TOU Schedule
entities:
  - entity: input_number.hot_tub_max_setpoint
    name: Max Setpoint (comfort)
  - entity: input_number.hot_tub_coast_setpoint
    name: Coast Setpoint (floor)
  - entity: sensor.hot_tub_expected_setpoint
    name: Expected Now
  - entity: number.tublemetry_hot_tub_setpoint
    name: Commanded Setpoint
  - entity: sensor.tublemetry_hot_tub_detected_setpoint
    name: Panel Setpoint
  - entity: automation.hot_tub_tou_schedule
    name: TOU Schedule
  - entity: input_boolean.thermal_runaway_active
    name: Thermal Runaway

---
# Card 9: Hot Tub Control -- replaces the hand-built card whose "Temp Up" and
# "Temp Down" rows pointed at button.tublemetry_hot_tub_temp_up_test /
# _temp_down_test. Those fire ONE raw relay pulse with no wake-press make-up and
# no verification, so the first press only wakes the panel -- hence having to
# press repeatedly. They also clear the injector's cached setpoint, forcing a
# probe down-press at the next TOU boundary. The script rows below run the
# closed loop instead and hold until the next schedule boundary.
type: entities
title: Hot Tub Control
entities:
  - entity: sensor.tublemetry_hot_tub_display
    name: Panel Display
  - entity: sensor.tublemetry_hot_tub_temperature
    name: Water Temperature
  - entity: sensor.tublemetry_hot_tub_detected_setpoint
    name: Detected Setpoint
  - entity: number.tublemetry_hot_tub_setpoint
    name: Setpoint
  - type: divider
  - entity: script.hot_tub_nudge_up
    name: Temp Up
    icon: mdi:thermometer-plus
  - entity: script.hot_tub_nudge_down
    name: Temp Down
    icon: mdi:thermometer-minus
  - entity: script.hot_tub_resume_schedule
    name: Resume Schedule
    icon: mdi:calendar-clock
  - type: divider
  - entity: binary_sensor.tublemetry_hot_tub_heater
    name: Heater
  - entity: binary_sensor.tublemetry_hot_tub_pump
    name: Pump
  - entity: sensor.tublemetry_hot_tub_display_state
    name: Display State
  - entity: input_boolean.hot_tub_manual_override
    name: Manual Override

---
# Card 10: Set to Hot / Set to Cold.
# tap_action is stated explicitly rather than relying on the button card's
# default (`toggle`, which happens to run a script but is not documented to).
# perform-action / perform_action is the current syntax; the older
# call-service / service spelling is no longer what the docs describe.
type: horizontal-stack
cards:
  - type: button
    name: Set to Hot
    icon: mdi:fire
    entity: script.hot_tub_set_hot
    show_state: false
    tap_action:
      action: perform-action
      perform_action: script.hot_tub_set_hot
  - type: button
    name: Set to Cold
    icon: mdi:snowflake
    entity: script.hot_tub_set_cold
    show_state: false
    tap_action:
      action: perform-action
      perform_action: script.hot_tub_set_cold

---
# Card 11: Seasonal setpoint sliders, EDITABLE.
# A bare tile card renders an input_number read-only -- it shows the state and
# nothing else, which is why "Hot Tub Max Setpoint 102 F" could not be changed.
# The numeric-input feature is what makes it settable. Verified against
# home-assistant.io/dashboards/features: it supports the number and
# input_number domains, and `style` is "slider" (default) or "buttons" --
# NOT "box".
type: horizontal-stack
cards:
  - type: tile
    entity: input_number.hot_tub_max_setpoint
    name: Max Setpoint
    features:
      - type: numeric-input
        style: buttons
  - type: tile
    entity: input_number.hot_tub_coast_setpoint
    name: Coast Setpoint
    features:
      - type: numeric-input
        style: buttons

---
# Card 12: Mode indicator light (ha/hot_tub_mode_light.yaml).
# light.nightlight is the ThirdReality Zigbee nightlight; its color and
# brightness are driven by automation.hot_tub_mode_light, not by this card.
# Adjust brightness with the sliders on Card 13, NOT the light's own
# brightness control -- see the header of hot_tub_mode_light.yaml for why a
# direct change there does not stick.
type: entities
title: Hot Tub Mode Light
entities:
  - entity: sensor.hot_tub_mode
    name: Mode
  - entity: sensor.hot_tub_nightlight_brightness
    name: Target Brightness
  - entity: sensor.nightlight_illuminance
    name: Ambient Light
  - entity: light.nightlight
    name: Nightlight
  - entity: automation.hot_tub_mode_light
    name: Mode Light Automation

---
# Card 13: Nightlight day/night brightness sliders, EDITABLE.
# Same tile + numeric-input pattern as Card 11 -- a bare tile card renders an
# input_number read-only. Default style ("slider") is used here on purpose,
# since these are free-form taste values rather than a precise setpoint.
type: vertical-stack
cards:
  - type: tile
    entity: input_number.hot_tub_nightlight_day_brightness
    name: Day Brightness
    features:
      - type: numeric-input
  - type: tile
    entity: input_number.hot_tub_nightlight_night_brightness
    name: Night Brightness
    features:
      - type: numeric-input
  - type: tile
    entity: input_number.hot_tub_nightlight_day_threshold
    name: Day/Night Threshold (lx)
    features:
      - type: numeric-input

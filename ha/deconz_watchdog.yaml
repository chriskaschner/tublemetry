# deCONZ gateway freeze watchdog
#
# THE FAULT (measured 2026-09-09, see WORKLOG.md for the full investigation)
# ------------------------------------------------------------------------
# The deCONZ add-on process HANGS -- 20-110 min at a time, ~8x/day, ~30% of wall
# clock. It is not a Zigbee, USB, radio, or battery problem, and it is not the
# process crashing: there was exactly ONE process start in 9 days. It freezes
# and later resumes as the same process.
#
# During a freeze deCONZ serves zero HTTP, logs nothing, and stops all Zigbee
# processing. Every deCONZ entity in HA goes `unavailable` together. On resume it
# re-opens the serial port, and the fridge door repopulates as `on` -- which is
# what produced the false door-open alerts that started this whole investigation.
#
# WHY CPU IS THE TRIGGER, NOT ENTITY AVAILABILITY
# -----------------------------------------------
# `sensor.deconz_cpu_percent` (a Supervisor add-on sensor, present but disabled
# by default -- enable it in the entity registry) separates the two states
# cleanly, with no overlap between the distributions:
#
#     healthy   median 1.38%   (n=27, min 1.31, max 1.49)
#     frozen    median 0.35%   (n=33, min 0.31, max 0.39)
#
# deCONZ goes QUIET when it hangs, not hot. That is a real finding: it rules out
# the two published candidates that look similar from the outside -- the
# main-thread spin loop in phoscon forum 6754 (100.7% CPU in state R) and the
# file-descriptor exhaustion in rest-plugin #8603, where a failing accept() loop
# would also burn a core. deCONZ here is BLOCKED on something with a long
# timeout. What, exactly, is still unknown; scripts/capture_deconz_freeze.sh is
# for answering that.
#
# The CPU drop leads HA marking entities `unavailable` by a measured 5.8 minutes,
# so triggering on CPU restarts the add-on ~10 min into a freeze instead of
# riding out a median 53. That is the whole point.
#
# 0.8% is the threshold because it sits in the empty gap between the two
# distributions with margin on both sides (frozen max 0.39, healthy min 1.31).
#
# WHY THIS EXISTS AT ALL: the deCONZ add-on's config.yaml has NO `watchdog:` key,
# so Supervisor will not restart it when it stops responding (cf. home-assistant/
# addons#2621). Nothing else is going to notice.
#
# This is a MITIGATION, not a fix. It caps ~30% downtime at a few minutes per
# episode. The underlying hang is unresolved and, as of 2026-09-09, matches no
# published issue -- documented deCONZ hangs are ~30-60 seconds or terminal.
#
# Deploy: tublemetry-ha repo packages/ (Git-pull synced), like the other packages.

template:
  - binary_sensor:
      # Consumers gate their alerts on this rather than on a single sensor being
      # unavailable, so a gateway freeze does not masquerade as a dead device.
      #
      # Two witnesses, deliberately: one weak battery device dropping off the
      # mesh is that device's problem, but BOTH deCONZ devices going unavailable
      # at once is the gateway. That is exactly how the fault was diagnosed --
      # the two dropped out at byte-identical timestamps while a non-deCONZ
      # ESPHome entity stayed up (1.5% vs 30% unavailable).
      #
      # Availability-based rather than CPU-based on purpose: this stays correct
      # even if sensor.deconz_cpu_percent is disabled again, and it describes
      # what consumers actually care about -- whether deCONZ entity states can be
      # trusted right now.
      - name: "deCONZ Gateway Up"
        unique_id: deconz_gateway_up
        device_class: connectivity
        icon: mdi:zigbee
        state: >-
          {% set vent = states('sensor.temperature_3') %}
          {% set door = states('binary_sensor.openclose_5') %}
          {% set dead = ['unknown', 'unavailable'] %}
          {{ not (vent in dead and door in dead) }}

counter:
  deconz_watchdog_restarts:
    name: "deCONZ Watchdog Restarts Today"
    icon: mdi:restart-alert
    step: 1

automation:
  - id: deconz_freeze_watchdog
    alias: deCONZ Freeze Watchdog
    description: >
      Restarts the deCONZ add-on when its CPU collapses to the frozen band,
      then verifies the restart actually recovered it.
    # single + the trailing cooldown means a restart cannot be re-attempted
    # while the add-on is still coming back up.
    mode: single

    trigger:
      - platform: numeric_state
        entity_id: sensor.deconz_cpu_percent
        below: 0.8
        for:
          minutes: 10

    condition:
      # Do not fight a deliberate stop. If someone stopped the add-on, leave it
      # stopped.
      - condition: state
        entity_id: binary_sensor.deconz_running
        state: "on"
      # numeric_state will not fire on a non-numeric state, but the add-on going
      # away mid-`for:` is exactly when this would misfire, so re-check.
      - condition: template
        value_template: >-
          {{ states('sensor.deconz_cpu_percent') not in ['unknown', 'unavailable'] }}

    action:
      - action: counter.increment
        target:
          entity_id: counter.deconz_watchdog_restarts

      - action: system_log.write
        data:
          level: warning
          logger: tubtron.deconz_watchdog
          message: >-
            DECONZ WATCHDOG: cpu {{ states('sensor.deconz_cpu_percent') }}% held
            below 0.8 for 10 min -- the add-on is frozen. Restarting core_deconz
            (restart {{ states('counter.deconz_watchdog_restarts') }} today).

      - action: hassio.addon_restart
        data:
          addon: core_deconz

      # Verify the remediation worked rather than assuming it did. A restart that
      # does not recover CPU means this watchdog is not the answer for whatever
      # is happening, and that is worth knowing immediately.
      - wait_template: >-
          {{ states('sensor.deconz_cpu_percent') | float(0) > 0.8 }}
        timeout: "00:05:00"
        continue_on_timeout: true

      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          - action: system_log.write
            data:
              level: error
              logger: tubtron.deconz_watchdog
              message: >-
                DECONZ WATCHDOG: restarted core_deconz but CPU did not recover
                above 0.8 within 5 min. The restart did not fix it.
          - action: notify.mobile_app_chris_iphone
            data:
              title: "deCONZ watchdog failed"
              message: >-
                Restarted the deCONZ add-on but it did not recover. Zigbee is
                likely still down -- needs a look.
              data:
                tag: deconz_watchdog

      # Cooldown. Holds the single-mode run open so a freeze that resumes
      # immediately cannot start a restart loop.
      - delay: "00:10:00"

  # A handful of restarts a day is the expected steady state until the root cause
  # is found, so restarts are logged and counted but deliberately NOT pushed --
  # 8 pushes a day is how the fridge alert became ignorable in the first place.
  # This fires only when the rate is high enough to mean something has changed.
  - id: deconz_watchdog_excessive
    alias: deCONZ Watchdog Restarting Excessively
    description: >
      The watchdog is firing far more than the measured ~8 freezes/day baseline,
      which means the restart is not holding or the fault has worsened.
    mode: single

    trigger:
      - platform: numeric_state
        entity_id: counter.deconz_watchdog_restarts
        above: 14

    action:
      - action: system_log.write
        data:
          level: error
          logger: tubtron.deconz_watchdog
          message: >-
            DECONZ WATCHDOG: {{ states('counter.deconz_watchdog_restarts') }}
            restarts today, well above the ~8/day baseline. Restarting is no
            longer holding.
      - action: persistent_notification.create
        data:
          title: "deCONZ restarting excessively"
          notification_id: deconz_watchdog_excessive
          message: >-
            The deCONZ watchdog has restarted the add-on
            {{ states('counter.deconz_watchdog_restarts') }} times today, against
            a measured baseline of ~8 freezes/day.

            Restarting is no longer holding it. Run
            scripts/capture_deconz_freeze.sh during the next freeze, or consider
            migrating off the deCONZ add-on to ZHA.

  - id: deconz_watchdog_daily_reset
    alias: deCONZ Watchdog Daily Reset
    description: Resets the restart counter so the excessive-rate check is per-day.
    mode: single
    trigger:
      - platform: time
        at: "00:00:00"
    action:
      - action: counter.reset
        target:
          entity_id: counter.deconz_watchdog_restarts
      - action: persistent_notification.dismiss
        data:
          notification_id: deconz_watchdog_excessive

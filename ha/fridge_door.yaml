# Outdoor fridge door-ajar alerting -- SONOFF SNZB-04PR2 via deCONZ
#
# binary_sensor.openclose_5, device_class 'opening': on = open, off = closed.
#
# Escalating by design (chosen 2026-08-31): an outdoor fridge in summer heat
# loses its contents if a door is left ajar, and a single push is easy to miss
# when you are already outside and away from your phone. So it nags every 5
# minutes until the door is actually shut, then confirms the close.
#
# The nagging is capped at 12 reminders (~1 hour). Past that the message has
# clearly not landed, and an uncapped loop would push forever on a sensor stuck
# in the 'open' state -- which is exactly what a dead magnet or a failing reed
# switch looks like.
#
# The open-duration threshold is a slider rather than a constant because loading
# groceries legitimately holds the door open for a while, and the right value is
# a matter of taste. Per the helpers.yaml note, no `initial:` is declared (it
# would reset your tuning on every restart), so the slider comes up at its
# minimum -- which is set to 3 so the unconfigured default is the intended one.
#
# ONLY 'off' -> 'on' IS TRUSTED -- ADDED 2026-09-09 AFTER FALSE ALERTS
# --------------------------------------------------------------------
# The original trigger fired on "state is 'on' for N minutes" regardless of what
# preceded the 'on'. That paged the phone roughly 9 times a day, because:
#
#   - The deCONZ gateway drops out ~9x/day (measured 34.6% of a 72h window).
#     Both deCONZ devices go unavailable at byte-identical timestamps while a
#     non-deCONZ ESPHome entity stays up at 1.5%, so this is the gateway, not
#     this sensor's radio link and not the magnet.
#   - Since 09-08 17:23 every reconnect repopulated this entity as 'on'. The
#     phantom 'on' then persisted for 35-148 min -- never self-correcting, only
#     ending at the next dropout -- which is far past the 3-minute threshold.
#   - 7 of the last 8 alert-length OPEN episodes were 'unavailable' -> 'on'.
#     Real openings in the same window were 3-8 SECONDS long.
#
# So the trigger now demands an 'off' -> 'on' edge. A repopulated 'on' after a
# dropout is arriving from 'unavailable' and is ignored.
#
# KNOWN GAP, ACCEPTED: a door genuinely opened while deCONZ is disconnected
# comes back as 'unavailable' -> 'on' and will NOT page. That is deliberate --
# there is no way to tell it apart from the phantom, and at 9 false pages a day
# the alert was being ignored anyway, which is worse. The gap closes on its own
# once the gateway is fixed; until then the stuck-sensor watchdog below leaves a
# silent persistent notification so a long 'on' is still visible without pushing.
# Re-evaluate this gate once deCONZ dropouts are resolved.
#
# Diagnose with: uv run scripts/diagnose_fridge_door.py
#
# NO TAMPER ALERT -- INVESTIGATED 2026-08-31, BLOCKED ON deCONZ
# -------------------------------------------------------------
# The SNZB-04PR2 hardware HAS a tamper switch, but it is unreachable from HA
# today. Do not re-derive this:
#
#   - HA exposes only 3 entities for the device. Checked the ENTITY REGISTRY, not
#     just the state machine -- there is no disabled tamper entity hiding either.
#   - deCONZ 2.33.2 (add-on 8.7.2) is already current. Add-on 8.8.0 only swaps the
#     base image to trixie; it does NOT bump deCONZ. Updating does not help.
#   - Root cause: devices/sonoff/snzb-04_open_close_sensor.json defines items
#     state/open, state/lowbattery, config/battery, config/enrolled,
#     config/reachable -- and NO tamper item. The SNZB-04PR2 was added by cloning
#     the plain SNZB-04 (PR #8598), which has no tamper switch at all. deCONZ
#     parses only the IAS Zone alarm bit and discards the tamper bit.
#   - Confirmed empirically: tripping the tamper switch on the live device emits
#     NO deconz_event and no attribute change. It only produces sub-second
#     open->close pulses on binary_sensor.openclose_5 (measured: 20:32:32 on ->
#     20:32:33 off, then on->off inside the same second).
#
# A short-pulse heuristic was considered and REJECTED (user, 2026-08-31): a door
# slam or reed-switch chatter would false-trigger it, and a tamper alert you
# learn to distrust is worse than none.
#
# THE REAL FIX when host file access is convenient: copy the stock DDF into
# /config/deconz/devices/ and add a state/tampered item bound to bit 2 of the IAS
# Zone Status attribute. deCONZ prefers user DDFs over bundled ones, and HA's
# deCONZ integration already renders state/tampered as a tamper binary sensor.
# Then wire the alert here using the REAL entity id -- do not guess it.
#
# Deploy: tublemetry-ha repo packages/ (Git-pull synced), like the other packages.

input_number:
  fridge_door_open_minutes:
    name: "Fridge Door Open Minutes"
    min: 3
    max: 30
    step: 1
    unit_of_measurement: "min"
    icon: mdi:fridge-alert

input_boolean:
  fridge_door_alerted:
    name: "Fridge Door Alerted"
    icon: mdi:fridge-alert-outline

automation:
  - id: fridge_door_left_open
    alias: Fridge Door Left Open
    description: >
      Pushes once the outdoor fridge door has been open past the configured
      threshold, then re-nags every 5 minutes until it is closed (capped at 12
      reminders), and confirms when it finally shuts.
    # restart: a close-then-reopen starts a fresh alert cycle rather than being
    # swallowed by the previous run still sitting in its wait.
    mode: restart

    # Fires on the door-opening EDGE only. `from: "off"` is the whole fix: it
    # excludes 'unavailable' -> 'on', which is what a gateway reconnect looks
    # like. See the header for the measurements behind this.
    #
    # The threshold moved out of a trigger `for:` and into the wait_for_trigger
    # below. That drops the previous "template trigger, because `for:` templating
    # is only documented for template triggers" constraint entirely -- a
    # templated wait_for_trigger `timeout` is supported and documented -- while
    # keeping the slider honored.
    #
    # Caveat unchanged: the countdown does NOT survive an HA restart or an
    # automation reload, since the run is simply killed mid-wait. A restart while
    # the door is already open loses that episode's alert rather than delaying it
    # (there is no new 'off' -> 'on' edge to re-arm on). Accepted: restarts are
    # rare compared to the 9 false pages a day this removes.
    trigger:
      - platform: state
        entity_id: binary_sensor.openclose_5
        from: "off"
        to: "on"

    action:
      # Hold for the threshold, but wake immediately if the door shuts. A closed
      # door leaves wait.trigger set; a timeout leaves it none and means the door
      # is still open.
      - wait_for_trigger:
          - platform: state
            entity_id: binary_sensor.openclose_5
            to: "off"
        timeout: >-
          {{ (states('input_number.fridge_door_open_minutes') | int(3)) * 60 }}
        continue_on_timeout: true

      # Closed inside the threshold -- a normal grab from the fridge. Stop here
      # so no alert, and therefore no "closed again" confirmation either.
      - condition: template
        value_template: "{{ wait.trigger is none }}"

      # Never act on a sensor that dropped off the mesh mid-wait -- 'unavailable'
      # is not 'open'.
      - condition: state
        entity_id: binary_sensor.openclose_5
        state: "on"

      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.fridge_door_alerted

      - repeat:
          sequence:
            - variables:
                open_minutes: >-
                  {{ (states('input_number.fridge_door_open_minutes') | int(3))
                     + (repeat.index - 1) * 5 }}
            - action: notify.mobile_app_chris_iphone
              data:
                title: "Outdoor fridge door open"
                message: >-
                  Open for about {{ open_minutes }} minutes.
                  {%- if repeat.index > 1 %} Still not closed.{% endif %}
                data:
                  # Replace the previous reminder rather than stacking a new
                  # banner for every nag.
                  tag: fridge_door_open
            # Sleep in 5-min slices, but wake immediately when the door closes so
            # the loop exits promptly instead of running out a stale delay.
            - wait_for_trigger:
                - platform: state
                  entity_id: binary_sensor.openclose_5
                  to: "off"
              timeout: "00:05:00"
              continue_on_timeout: true
          while:
            - condition: state
              entity_id: binary_sensor.openclose_5
              state: "on"
            - condition: template
              value_template: "{{ repeat.index <= 12 }}"

      - if:
          - condition: state
            entity_id: binary_sensor.openclose_5
            state: "off"
        then:
          - action: persistent_notification.dismiss
            data:
              notification_id: fridge_door_open
          - action: notify.mobile_app_chris_iphone
            data:
              title: "Outdoor fridge closed"
              message: "The fridge door is shut again."
              data:
                tag: fridge_door_open
        else:
          # Still open after ~1 hour of reminders. Stop pushing, but leave a
          # persistent notification so the condition is not simply forgotten.
          - action: system_log.write
            data:
              level: warning
              logger: tubtron.fridge_door
              message: >-
                FRIDGE DOOR: open for over an hour after 12 reminders. Either it
                is genuinely open or binary_sensor.openclose_5 is stuck 'on'.
          - action: persistent_notification.create
            data:
              title: "Outdoor fridge still open"
              notification_id: fridge_door_open
              message: >-
                The outdoor fridge door has read open for over an hour and 12
                reminders. No further push reminders will be sent for this
                episode.

                If the door is actually shut, the sensor may be stuck -- check the
                magnet alignment and its battery
                ({{ states('sensor.openclose_5_battery') }}%).

      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.fridge_door_alerted

  # Covers the gap the 'off' -> 'on' gate deliberately opens. Deliberately does
  # NOT push: the whole point of the gate is that this transition is untrusted,
  # and pushing on it would just reinstate the false alerts on a 60-minute lag.
  # A persistent notification keeps a genuinely-open door visible in the UI, and
  # the log line is the counter to watch while chasing the deCONZ dropouts --
  # every firing here is one gateway reconnect that repopulated the door as open.
  - id: fridge_door_sensor_stuck_open
    alias: Fridge Door Sensor Stuck Open
    description: >
      Silent watchdog. The door sensor came back from a gateway dropout reading
      'open' and has stayed that way for an hour, which is either a phantom
      state or a door that was opened while deCONZ was disconnected.
    mode: single

    trigger:
      - platform: state
        entity_id: binary_sensor.openclose_5
        from: "unavailable"
        to: "on"
        for:
          minutes: 60

    action:
      - action: system_log.write
        data:
          level: warning
          logger: tubtron.fridge_door
          message: >-
            FRIDGE DOOR: binary_sensor.openclose_5 returned from a gateway
            dropout as 'on' and held for 60 min. No push sent (untrusted
            transition). Run scripts/diagnose_fridge_door.py.
      - action: persistent_notification.create
        data:
          title: "Outdoor fridge reads open (unverified)"
          notification_id: fridge_door_stuck
          message: >-
            binary_sensor.openclose_5 came back from a deCONZ dropout reading
            open and has held for an hour. No push was sent because a
            'unavailable' -> 'on' transition is not trusted.

            If the door is actually shut, this is the known deCONZ gateway fault
            and can be ignored. If it is actually open, the gate cost you an
            alert -- go check.

  # Clears the watchdog notice as soon as the sensor reports a real close, so a
  # stale "reads open" banner does not linger after the gateway sorts itself out.
  - id: fridge_door_stuck_cleared
    alias: Fridge Door Stuck Notice Cleared
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.openclose_5
        to: "off"
    action:
      - action: persistent_notification.dismiss
        data:
          notification_id: fridge_door_stuck
